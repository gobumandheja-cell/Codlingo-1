<html>
    <head>
        <title>My colour Card</title>


        <style>

        /* Universal selector - applies to everything on the page */
        * {
            font-size: 16px;
        }

        /* Element Selectors */
        body {
            background-color:  lightgray;
        }

        h1 {
            color:  darkblue
        }
        h2 {
            color:purple; 
        }

        p {
            color:dimgray;
        }

        /* Class Selector */
        .my-detail {
            color: darkgreen;
            font-weight: bold;
        }

       
        /* ID selector */
        #my-card {
            background-color: lightcyan;
        }
        
        </style>


    </head>
    <body>
        
        <h1>My Colour Card</h1>

      <!--Inline CSS:-->
      <p style="color: crimson;">Hi! This is my very own webpage</p>

      <div id="my-card">
        <h2>About me</h2>
        <p class="my-detail">My name is hans.</p>
        <p class="my-detail">My favourite colour is red.</p>
      </div>

      <h2>My favourite Things</h2>
      <p>My favouriteanimal is a cat</p>

      
    </body>
</html>
