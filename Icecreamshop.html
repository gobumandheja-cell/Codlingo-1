<html>
    <head>
        <title>My Icecream Shop Menu</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #fff4f8;
                text-align: center;
                color: #4a2c2a;
            }
            h1 {
                color: #d63384;
                font-size: 36px;
            }
            h1 + p {
                color: #8a2be2;
                font-weight: bold;
                background-color: #ffe3f1;
                border-radius: 10px;
            }

            .shop-description::first-letter {
                font-size: 200%;
                color: #d63384;
                font-weight: bold;
            }
            .menu-box {
                display: inline-block;
                background-color: #fff;
                border: 2px solid #d63384;
                border-radius: 10px;
                padding: 15px;
                margin: 10px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            }
            ul{
                padding: 0;
            }
            ul > li {
                list-style: none;
                background-color: #fff0f5;
                color: #5c2a4a;
                font-size: 18px;
                font-weight: bold;
                margin: 10px;
                padding: 12px;
                border-radius: 10px;
                border: 2px solid #ffb6c1
            }
            ul > li:nth-child(3) {
                background-color: #fff3cd;
                color: #b85c00;
                border: 3px solid #ffa500;
            }
            ul > li:hover {
                background-color: #ff69b4;
                color: #b85c00;
                cursor: pointer;
                transform: scale(1.05);
            }
        button:hover {
            background-color: #8a2be2;
        }
        </style>
    </head>
    <body>
        <h1>My icecream  Shop Menu</h1>
        <p>Welcome to my icecream Flavours</p>
        <ul>
            <li>Chocolate Delight</li>
            <li>Strawberry Swirl</li>
            <li>Mango Magic - Today's Specail</li>
            <li>Vanilla Dream</li>
            <li>Blueberry Blast</li>
        </ul>
        <button>Order Now</button>
        <div></div>
    </body>
</html>
