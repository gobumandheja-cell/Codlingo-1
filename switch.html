<html>

<body>
    <h2>JavaScript String Methods</h2>
    <p id="day"></p>
    <script>

        let day = new Date().getDay()
        switch (day) {
            case 1:
                document.getElementById("day").innerHTML = "Day is Monday"
                break;
            case 2:
                document.getElementById("day").innerHTML = "Day is Tuesday"
                break
            case 3:
                document.getElementById("day").innerHTML = "Day is Tuesday"
                break
            default:
                console.log("I dont know the day")

        }
    </script>
</body>

</html>
