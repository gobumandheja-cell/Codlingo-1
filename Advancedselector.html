<html>
    <head>
        <title>My food Menu</title>
        <style>
            body {
                text-align: center;
            }

            h1{ color: #e65c00}
            
            

            /*Sibling Selector - styles the paragraph right after h1 */
            h1 + p {
                background: #ffe0b2;
                border-radius: 8px;
                color: #bf360c
            }
     
            
            /* Child Selector - style only direct Li children of ul */
            ul > li {
                List-style: none;
                font-size: 18px;
                color: #5d4037;
                width: 260px;
            }


            /* nth-child - high;ights the 3rd item as Chef's Special*/
            ul li:nth-child(3){
                background:  #ffe082;
     color: #e65c00;
   }


   .desc {
     color: #555;
     font-size: 15px;
   }


   /* first-letter - makes the first letter big and bold */
   .desc::first-letter {
     font-size: 30px;
     color: #e65c00;
     font-weight: bold;
   };
     
    a:hover {
        background: #e65c00;
        color: white;
    }

        </style>
    </head>
    <body>
        
        <h1>My food Menu</h1>
        <p>Check out our delicious offerings!</p>

        <ul>
            <li>Pizza</li>
            <li>Burger</li>
            <li>Tacos — Chef's Special!</li>
            </ul>
            
            
            <p class="desc">Every dish on this menu is made with love!</p>
            
            
            <div>
                <a href="#">Order Now</a>
                <a href="#">See More</a>
            </div>
        </ul>
    </body>
</html>
