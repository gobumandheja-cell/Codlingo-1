<html>
  <head>
    <title>My Restaurant Menu Card</title>

    <style>
      *{
        box-sizing: border-box;
      }

      body {
        font-family: Georgia, serif;
        background-color: #fff8e1;
        color: #3b2f2f
      }

      .menu-card {
        width: 600px;
        border: 3px solid #8b4513;
        border-radius: 15px;
        background-color: #ffffff;
        box-shadow: 0 0 20px #8b4513;
      }

      .restaurant-name {
        font-size: 42px;
        font-weight: bold;
        color: #8b0000;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 2px 2px 4px #d2b48c;        
      }

      .tagline {}
    </style>
  </head>
</html>
